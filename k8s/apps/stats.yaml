apiVersion: apps/v1
kind: Deployment
metadata:
  name: stats
  labels:
    app.kubernetes.io/name: stats
    app.kubernetes.io/part-of: jobq
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stats
        app.kubernetes.io/part-of: jobq
    spec:
      containers:
        - name: stats
          image: jobq-stats:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: jobq-config
          env:
            - name: PORT
              value: "3001"
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_USER
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: RABBITMQ_PASSWORD
            - name: RABBITMQ_URL
              value: amqp://$(RABBITMQ_USER):$(RABBITMQ_PASSWORD)@rabbitmq:5672
---
apiVersion: v1
kind: Service
metadata:
  name: stats
  labels:
    app.kubernetes.io/name: stats
    app.kubernetes.io/part-of: jobq
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stats
  ports:
    - name: http
      port: 3001
      targetPort: http
