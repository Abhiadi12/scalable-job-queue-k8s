apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: jobq
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /submit
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  name: http
          - path: /status
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  name: http
